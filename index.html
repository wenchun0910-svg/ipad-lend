<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ipad充電車資訊設備借用系統</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    :root { 
      --primary: #1b8296; /* 清新湖水綠 (主標題) */
      --primary-light: #28a9c3;
      --accent-yellow: #f1b262; /* 淺鵝黃色 */
      --accent-pink: #f27c75; /* 點綴粉紅 */
      --accent-green: #8cc63f; /* 葉子自然綠色 */
      --accent-blue: #60a5fa; /* 天空藍 */
      --bg: #a6dce0; /* 清新天空藍背景 */
      --container-bg: #ffffff;
      --text-dark: #1b8296;
      --success: #27ae60; 
      --danger: #e74c3c; 
      --past: #dcdde1; 
      --gray: #95a5a6; 
      --admin-purple: #1b8296; 
      --admin-bg: #f2f7f9;     
    }
    
    body { 
      font-family: 'Nunito', 'Microsoft JhengHei', sans-serif; 
      background-color: var(--bg); 
      margin: 0; 
      padding: 0; 
      font-size: 11pt; 
      color: #333; 
      overflow-x: hidden;
    }

    h1, h2, h3, .app-title {
      font-family: 'Fredoka', 'Microsoft JhengHei', sans-serif;
      color: var(--text-dark);
    }

    /* === 浮動背景插圖 (裝飾用) === */
    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(5deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    .bg-illustration {
      position: fixed;
      font-size: 3rem;
      opacity: 0.8;
      z-index: 0;
      animation: float 6s ease-in-out infinite;
      pointer-events: none;
    }
    .ill-1 { top: 5%; left: 5%; animation-delay: 0s; font-size: 4rem; }
    .ill-2 { top: 15%; right: 10%; animation-delay: 1s; font-size: 3.5rem; }
    .ill-3 { bottom: 10%; left: 8%; animation-delay: 2s; font-size: 3.5rem; }
    .ill-4 { bottom: 15%; right: 5%; animation-delay: 3s; font-size: 4rem; }

    .app-wrapper {
      position: relative;
      max-width: 1000px;
      margin: 40px auto;
      z-index: 10;
      filter: drop-shadow(0 15px 30px rgba(27, 130, 150, 0.25)); /* 配合新背景顏色的陰影 */
    }

    .wavy-top {
      width: 100%;
      height: 45px;
      /* 改為雲朵邊緣風格 */
      background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1440 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><path fill="%23ffffff" d="M0,60 Q120,10 240,60 T480,60 T720,60 T960,60 T1200,60 T1440,60 L1440,100 L0,100 Z"></path></svg>') no-repeat bottom;
      background-size: 100% 45px;
    }

    .wavy-bottom {
      width: 100%;
      height: 35px;
      /* 改為木頭桌子風格 */
      background: #f1b262;
      background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.03) 0px, rgba(0,0,0,0.03) 2px, transparent 2px, transparent 8px);
      border-bottom-left-radius: 15px;
      border-bottom-right-radius: 15px;
    }

    .main-content {
      background-color: var(--container-bg);
      padding: 10px 40px 40px 40px;
    }

    @media (max-width: 768px) {
      .app-wrapper { margin: 10px auto; }
      .main-content { padding: 10px 20px 30px 20px; }
      .bg-illustration { display: none; /* 手機版隱藏背景圖案 */ }
    }

    /* === 頂部標題與導覽列 === */
    .app-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      flex-wrap: wrap; 
      margin-bottom: 25px;
      border-bottom: 3px dashed #eee;
      padding-bottom: 15px;
    }
    .app-title { font-size: 2.2rem; margin: 0; color: var(--primary); letter-spacing: 1px; }
    .app-title span { color: var(--accent-blue); font-size: 1.2rem; vertical-align: middle; margin-left: 10px; font-family: 'Nunito', sans-serif; font-weight: 700; }
    
    .app-nav { display: flex; gap: 10px; flex-grow: 1; justify-content: center; overflow-x: auto; white-space: nowrap; margin-top: 10px;}
    .nav-item { padding: 12px 24px; cursor: pointer; font-weight: 700; color: #777; background: #f0f3f5; border-radius: 30px; transition: 0.3s; font-size: 11pt; border: 2px solid transparent;}
    .nav-item:hover { background: #e2e8f0; transform: translateY(-2px); }
    .nav-item.active { background: var(--accent-yellow); color: white; border-color: #e69d3c; box-shadow: 0 4px 10px rgba(242, 170, 76, 0.4); }
    .nav-item.admin-nav { background: #f0f0f5; color: var(--admin-purple); display: none; }
    .nav-item.admin-nav.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 10px rgba(27, 130, 150, 0.3); }

    .header-user { font-size: 11pt; color: #fff; background: var(--primary-light); padding: 8px 16px; border-radius: 20px; display: flex; align-items: center; gap: 10px; font-weight: 700;}
    .btn-logout { background: var(--accent-pink); border: 1px solid #ff8888; color: #a12b2b; font-weight: bold; cursor: pointer; padding: 4px 10px; border-radius: 15px; font-size: 10pt; transition: 0.2s;}
    .btn-logout:hover { background: #ff9999; }

    .view-section { display: none; animation: fadeIn 0.4s ease; }
    .view-section.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* === 我要預約 === */
    .booking-controls { display:grid; grid-template-columns: 1fr 1fr; gap:15px; background:var(--accent-blue); padding:20px; border-radius:15px; margin-bottom:20px; box-shadow: 0 5px 15px rgba(123, 181, 230, 0.2); }
    .booking-controls label { font-weight: 700; color: #fff; font-size: 11pt; text-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    .booking-controls input, .booking-controls select { width: 100%; padding: 12px; border-radius: 8px; border: 2px solid #fff; margin-top: 8px; box-sizing: border-box; font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 11pt; color: var(--primary); }
    
    .locked-input { opacity: 0.7; cursor: not-allowed !important; background-color: #eef2f5 !important; }
    .proxy-alert { display:none; background: var(--accent-yellow); color:#856404; padding:15px; border-radius:12px; margin-bottom:20px; font-weight:bold; align-items: center; gap: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    
    .daily-board { background: #fffdf5; border: 2px dashed #f3c22b; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
    .daily-board h3 { margin: 0 0 15px 0; color: #d35400; font-size: 13pt; }
    .daily-tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .daily-tag { background: white; border: 2px solid var(--accent-yellow); color: #d35400; padding: 6px 12px; border-radius: 20px; font-size: 10pt; font-weight: bold; }

    table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 15px; table-layout: fixed; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 2px solid #edf2f7; }
    th, td { padding: 15px 8px; text-align: center; border-bottom: 1px solid #edf2f7; border-right: 1px solid #edf2f7; }
    th { background: #f8fafc; color: var(--primary); line-height: 1.4; font-weight: 700; font-family: 'Fredoka', sans-serif; font-size: 12pt; border-bottom: 2px solid #e2e8f0; } 
    th:last-child, td:last-child { border-right: none; }
    tr:last-child td { border-bottom: none; }

    .skeleton { background: linear-gradient(110deg, #ececec 8%, #f5f5f5 18%, #ececec 33%); background-size: 200% 100%; animation: 1.5s shine linear infinite; border-radius:8px; height: 35px; }
    @keyframes shine { to { background-position-x: -200%; } }
    
    .btn-book { background: var(--accent-green); color: white; border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer; width: 90%; font-weight: bold; box-shadow: 0 4px 6px rgba(144, 194, 144, 0.3); transition: 0.2s; font-family: 'Nunito', sans-serif;}
    .btn-book:hover { transform: translateY(-2px); box-shadow: 0 6px 8px rgba(144, 194, 144, 0.4); }
    .cell-mine { color: var(--text-dark); font-weight: bold; background: var(--accent-yellow); padding: 6px; border: 2px solid #f3c22b; width: 90%; display:inline-block; border-radius: 8px; }
    .cell-booked { color: #fff; font-weight: bold; background: var(--accent-pink); padding: 6px; width: 90%; display:inline-block; border-radius: 8px; border: 2px solid #ff8888; }
    .cell-past { background: var(--past); color: #777; font-size: 10pt; border-radius: 8px; padding: 6px; display: inline-block; width: 90%; font-weight: 600;}
    .cell-restricted { color: #888; font-size: 10pt; background: #f1f5f9; font-weight: 600; border-radius: 8px; padding: 6px; }

    .admin-panel { background: var(--admin-bg); padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 2px dashed #cbd5e1; }
    .admin-panel h3 { margin: 0 0 15px 0; color: var(--admin-purple); font-size: 14pt; display: flex; align-items: center; gap: 8px; }
    .admin-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .admin-input { flex-grow: 1; padding: 12px; border-radius: 8px; border: 2px solid #cbd5e1; font-size: 11pt; background: white; cursor: pointer; min-width: 200px; font-family: 'Nunito', sans-serif; font-weight: 600; }
    .btn-admin-active { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 11pt; transition: 0.2s;}
    .btn-admin-active:hover { background: var(--primary-light); }
    .btn-admin-inactive { background: white; color: var(--primary); border: 2px solid var(--primary); padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 11pt; }

    /* === 我的紀錄 === */
    .tabs { display: flex; gap: 15px; margin-bottom: 25px; border-bottom: 3px solid #f1f5f9; padding-bottom: 15px; }
    .tab { padding: 10px 25px; cursor: pointer; border-radius: 30px; font-weight: 700; color: #94a3b8; background: #f8fafc; border: 2px solid #e2e8f0; transition: 0.3s; }
    .tab.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 10px rgba(27, 130, 150, 0.2); }
    
    .card { border-left: 8px solid var(--accent-blue); background: #fff; padding: 20px; margin-bottom: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); border-top: 1px solid #f1f5f9; border-right: 1px solid #f1f5f9; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; }
    .card.past { border-left-color: var(--gray); background: #f8fafc; opacity: 0.85; box-shadow: none; }
    .card.cancelled { border-left-color: var(--accent-pink); background: #fff5f5; opacity: 0.8; box-shadow: none; }
    .card .info { flex-grow: 1; }
    .card .title { font-family: 'Fredoka', sans-serif; font-size: 14pt; margin-bottom: 8px; color: var(--primary); }
    .card .detail { color: #64748b; font-size: 11pt; line-height: 1.6; font-weight: 600; }
    .card .detail span { font-weight: 700; color: var(--primary-light); background: #f1f5f9; padding: 2px 8px; border-radius: 6px; }
    
    .btn-cancel { background: white; color: var(--danger); border: 2px solid var(--danger); padding: 8px 18px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 10pt; transition: 0.2s; }
    .btn-cancel:hover { background: var(--danger); color: white; }
    .status-badge { padding: 6px 12px; border-radius: 8px; font-size: 10pt; font-weight: bold; display: inline-block; }
    .status-cancelled { background: #ffebee; color: var(--danger); border: 1px solid #ffcdd2; }
    .status-past { color: var(--gray); font-style: italic; font-size: 11pt; font-weight: 600; }

    /* === 管理後台 === */
    .admin-tabs { display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 3px solid #f1f5f9; padding-bottom: 15px; overflow-x: auto; white-space: nowrap; }
    .admin-tab { padding: 10px 20px; cursor: pointer; border-radius: 30px; font-weight: 700; background: #f8fafc; border: 2px solid #e2e8f0; color: #94a3b8; transition: 0.3s; }
    .admin-tab.active { background: var(--admin-purple); color: white; border-color: var(--admin-purple); box-shadow: 0 4px 10px rgba(94, 107, 145, 0.3); }
    
    .admin-card { border-left: 6px solid var(--admin-purple); background: #fff; padding: 20px; margin-bottom: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); display: block; border: 1px solid #f1f5f9;}
    .key-group { display: flex; gap: 8px; margin-top: 15px; }
    .key-btn { flex: 1; padding: 8px; border: 2px solid #e2e8f0; border-radius: 8px; cursor: pointer; font-size: 10pt; font-weight: bold; background: white; color: #64748b; transition: 0.2s; }
    .key-btn.active-unlent { background: var(--gray); color: white; border-color: var(--gray); }
    .key-btn.active-lent { background: var(--danger); color: white; border-color: var(--danger); }
    .key-btn.active-returned { background: var(--success); color: white; border-color: var(--success); }
    
    .form-row { margin-bottom: 20px; }
    .form-row label.title { display: block; font-weight: 700; margin-bottom: 8px; color: var(--primary); font-size: 11pt; }
    .form-row input[type="date"], .form-row input[type="text"], .form-row select { width: 100%; padding: 12px; box-sizing: border-box; border-radius: 8px; border: 2px solid #cbd5e1; font-size: 11pt; font-family: 'Nunito', sans-serif; font-weight: 600;}
    .check-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 12px; background: #f8fafc; padding: 20px; border-radius: 12px; border: 2px dashed #cbd5e1; }
    .check-item { display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 600; color: var(--primary);}
    .btn-submit { width: 100%; padding: 15px; background: var(--admin-purple); color: white; border: none; border-radius: 12px; font-weight: bold; font-size: 13pt; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(94, 107, 145, 0.3);}
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(94, 107, 145, 0.4); }

    /* === 排行榜與圖表 === */
    .chart-header { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
    .chart-tab { padding: 10px 25px; cursor: pointer; border-radius: 30px; font-weight: bold; color: #94a3b8; background: #f8fafc; border: 2px solid #e2e8f0; transition: 0.3s; font-size: 11pt; }
    .chart-tab.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 10px rgba(27, 130, 150, 0.3); }
    .dashboard-panel { flex: 1; min-width: 300px; background: #f8fafc; padding: 20px; border-radius: 15px; border: 1px solid #e2e8f0; }
    .leaderboard-item { display: flex; align-items: center; padding: 15px; margin-bottom: 10px; background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); border-left: 6px solid #cbd5e1; transition: transform 0.2s; }
    .leaderboard-item:hover { transform: scale(1.02); }
    .leaderboard-item.rank-1 { border-left-color: var(--accent-yellow); background: #fffdf5; }
    .leaderboard-item.rank-2 { border-left-color: #cbd5e1; background: #f8fafc; }
    .leaderboard-item.rank-3 { border-left-color: #f3c22b; background: #fffcf0; }
    .rank-badge { width: 36px; height: 36px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; margin-right: 15px; font-size: 11pt; background: #f1f5f9; color: #64748b; }
    .rank-1 .rank-badge { background: var(--accent-yellow); color: #b8860b; font-size: 14pt; box-shadow: 0 2px 5px rgba(253, 224, 120, 0.5);}
    .item-name { flex-grow: 1; font-weight: bold; font-size: 12pt; color: var(--primary); }

    #loginOverlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:var(--primary); z-index:9998; align-items:center; justify-content:center; }
    
    /* 登入區塊周圍的裝飾波浪 */
    .login-wrapper { position: relative; width: 350px; max-width: 90%; }
    .login-box { background: var(--container-bg); padding: 40px 30px; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.4); text-align: center; position: relative; z-index: 10; }
    .login-box h2 { color: var(--primary); margin-top: 0; margin-bottom: 25px; font-size: 2rem; }
    .login-box h2 span { color: var(--accent-yellow); }
    .login-input { width: 100%; padding: 14px; border: 2px solid #cbd5e1; border-radius: 10px; box-sizing: border-box; font-size: 11pt; font-family: 'Nunito', sans-serif; font-weight: 600; color: var(--primary);}
    .login-input:focus { outline: none; border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2); }
    .btn-login { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 10px; font-weight: bold; font-size: 13pt; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.2); font-family: 'Fredoka', sans-serif; letter-spacing: 1px;}
    .btn-login:hover { background: var(--primary-light); transform: translateY(-2px); }
    
    /* 修正圖層高度 z-index，確保不會被登入視窗遮擋，並改為新版深色遮罩 */
    #overlay, #alertOverlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(27, 130, 150, 0.8); z-index:10000; backdrop-filter: blur(3px); }
    #modal, #alertModal { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:white; padding:30px; border-radius:20px; z-index:10001; width:320px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); text-align: center; border-top: 8px solid var(--accent-yellow);}
    
    #modal h3 { font-family: 'Fredoka', sans-serif; font-size: 1.5rem; margin-top: 0;}
    .modal-input { width: 100%; box-sizing: border-box; padding: 12px; margin-top: 8px; margin-bottom: 20px; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 11pt; font-family: 'Nunito', sans-serif; font-weight: 600; color: var(--primary); }
    .btn-alert { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 15px; width: 100%; font-size: 12pt; box-shadow: 0 4px 10px rgba(27, 130, 150, 0.3);}
    .confirm-btns { display: flex; gap: 15px; margin-top: 20px; }
    .btn-cancel-modal { background: #f1f5f9; color: #64748b; border: none; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: bold; flex: 1; transition: 0.2s; font-size: 11pt;}
    .btn-cancel-modal:hover { background: #e2e8f0; }
    .btn-confirm-modal { background: var(--danger); color: white; border: none; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: bold; flex: 1; transition: 0.2s; box-shadow: 0 4px 10px rgba(231, 76, 60, 0.3); font-size: 11pt;}
    .btn-confirm-modal:hover { background: #c0392b; }
  </style>
</head>
<body>

<!-- 背景裝飾插圖 (全域) -->
<div class="bg-illustration ill-1">
  <svg viewBox="0 0 64 80" width="1em" height="1em" xmlns="http://www.w3.org/2000/svg"><rect x="8" y="4" width="48" height="72" rx="4" fill="#1e293b"/><rect x="12" y="8" width="40" height="64" fill="#f8fafc"/><circle cx="24" cy="30" r="14" fill="#60a5fa" opacity="0.8"/><circle cx="40" cy="45" r="16" fill="#f87171" opacity="0.8"/><circle cx="24" cy="55" r="12" fill="#fbbf24" opacity="0.8"/></svg>
</div>
<div class="bg-illustration ill-2">
  <svg viewBox="0 0 80 80" width="1em" height="1em" xmlns="http://www.w3.org/2000/svg" transform="rotate(-15)"><rect x="16" y="10" width="48" height="60" rx="4" fill="#3b82f6"/><rect x="20" y="14" width="40" height="52" fill="#ffffff"/><circle cx="35" cy="30" r="12" fill="#f87171" opacity="0.9"/><circle cx="45" cy="50" r="14" fill="#a3e635" opacity="0.8"/><line x1="60" y1="20" x2="35" y2="45" stroke="#1e40af" stroke-width="3" stroke-linecap="round"/></svg>
</div>
<div class="bg-illustration ill-3">
  <svg viewBox="0 0 80 64" width="1em" height="1em" xmlns="http://www.w3.org/2000/svg" transform="rotate(10)"><rect x="4" y="8" width="72" height="48" rx="6" fill="#e2e8f0"/><rect x="8" y="12" width="64" height="40" fill="#0284c7"/><rect x="16" y="32" width="6" height="6" rx="1" fill="#ffffff"/><rect x="26" y="32" width="6" height="6" rx="1" fill="#f43f5e"/><rect x="36" y="32" width="6" height="6" rx="1" fill="#10b981"/><rect x="46" y="32" width="6" height="6" rx="1" fill="#eab308"/><rect x="56" y="32" width="6" height="6" rx="1" fill="#c084fc"/></svg>
</div>
<div class="bg-illustration ill-4">
  <svg viewBox="0 0 80 64" width="1em" height="1em" xmlns="http://www.w3.org/2000/svg"><path d="M 8 56 L 72 56 L 68 12 L 12 12 Z" fill="#334155"/><rect x="16" y="18" width="48" height="32" rx="2" fill="#ffedd5"/><path d="M 24 35 Q 32 20 40 35 T 56 25" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/><line x1="64" y1="12" x2="48" y2="30" stroke="#64748b" stroke-width="3" stroke-linecap="round"/></svg>

<script>
  // ⚠️ 請確保此處為最新發佈（且權限為所有人）的 Google Apps Script 網址
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwkdsYjOO7MEMizmPr1B_yKqfnj8rg4UQipWDniy-YcSVtjeVqCXxh2a73d1zCrDN6N/exec"; 

  const AppAPI = {
    async call(action, payload = {}) {
      if(GAS_API_URL.includes("在此貼上")) {
        alert("請先在原始碼中設定 GAS_API_URL！");
        return Promise.reject("API URL not set");
      }
      try {
        const response = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: action, payload: payload })
        });
        const data = await response.json();
        if (data.error) throw new Error(data.error);
        return data;
      } catch (error) {
        console.error(`API 呼叫失敗 [${action}]:`, error);
        throw error;
      }
    }
  };

  let staticData = { items: [], classes: [], periods: [], users: [], userInfo: null };
  let originalAdminName = ""; let originalAdminEmail = ""; let spoofedUserName = ""; 
  let currentSel = {}; let allMyRecords = []; 
  const dayNames = ['日', '一', '二', '三', '四', '五', '六'];
  let myChartInstance = null; let bookingRequestSerial = 0;
  let inactivityTimer; let adminAutoRefreshTimer; 
  const INACTIVITY_TIME_MS = 5 * 60 * 1000; 

  function resetInactivityTimer() {
    clearTimeout(inactivityTimer);
    const isUserAdmin = staticData && staticData.userInfo && (staticData.userInfo.isAdmin === true || staticData.userInfo.isAdmin === 'true');
    if (isUserAdmin) return; 
    if (document.getElementById('mainApp').style.display === 'block') {
      inactivityTimer = setTimeout(() => { doLogout(true); }, INACTIVITY_TIME_MS);
    }
  }

  function setupAutoLogout() {
    ['mousemove','keypress','click','scroll','touchstart'].forEach(evt => 
      document.addEventListener(evt, resetInactivityTimer)
    );
  }

  function getLocalTodayString() {
    const now = new Date();
    const offset = now.getTimezoneOffset() * 60000;
    return (new Date(now - offset)).toISOString().split('T')[0];
  }

  function renderLoginNameSelect(users) {
    const nameSel = document.getElementById('loginNameSelect');
    const currentVal = nameSel.value;
    nameSel.innerHTML = '<option value="">-- 請選擇您的姓名 --</option>' + users.map(u => `<option value="${u.name}">${u.name}</option>`).join('');
    if (currentVal) nameSel.value = currentVal;
  }

  window.onload = () => {
    const today = getLocalTodayString();
    ['targetDate','adminDate','resStartDate','resEndDate'].forEach(id => document.getElementById(id).value = today);
    setupAutoLogout(); 

    const savedUser = localStorage.getItem('appAuthSession');
    if (savedUser) {
      staticData.userInfo = JSON.parse(savedUser);
      initSPA();
    } else {
      document.getElementById('loginOverlay').style.display = 'flex';
      const localUsers = localStorage.getItem('localUserList_v2');
      if (localUsers) renderLoginNameSelect(JSON.parse(localUsers));
      
      AppAPI.call('getLoginUserList').then(users => {
        if(users && users.length > 0) {
           localStorage.setItem('localUserList_v2', JSON.stringify(users));
           if (!localUsers) renderLoginNameSelect(users); 
        }
      }).catch(err => {
          console.error("獲取使用者名單失敗", err);
          showSystemAlert("⚠️ 無法載入名單！\n請檢查 API 網址是否正確，且已部署最新版本。");
      });
    }
  };

  function doLogin() {
    const name = document.getElementById('loginNameSelect').value;
    const pin = document.getElementById('loginPinInput').value;
    if(!name || !pin) { showSystemAlert("請選擇姓名並輸入帳號！"); return; }
    
    const btn = document.getElementById('btnLoginSubmit');
    btn.innerText = "驗證中..."; btn.disabled = true;

    AppAPI.call('verifyLogin', { name, pin }).then(res => {
         if(res.success) {
            const authData = { name: res.name, email: res.email, isAdmin: res.isAdmin };
            localStorage.setItem('appAuthSession', JSON.stringify(authData));
            staticData.userInfo = authData;
            btn.innerText = "Login 登入"; btn.disabled = false;
            initSPA();
         } else {
            showSystemAlert("❌ " + res.msg);
            btn.innerText = "Login 登入"; btn.disabled = false;
         }
      }).catch(err => {
         showSystemAlert("⚠️ 系統連線失敗！\n可能是尚未發佈新版本，或學校網域封鎖了權限。\n(錯誤: " + err.message + ")");
         btn.innerText = "Login 登入"; btn.disabled = false;
      });
  }

  function doLogout(isAutoLogout = false) {
    localStorage.removeItem('appAuthSession');
    clearTimeout(inactivityTimer); clearInterval(adminAutoRefreshTimer); 
    document.getElementById('mainApp').style.display = 'none';
    document.getElementById('loginOverlay').style.display = 'flex';
    document.getElementById('loginPinInput').value = '';
    if (isAutoLogout) showSystemAlert("⏱️ 您已閒置超過 5 分鐘，為保護帳號安全，系統已自動為您登出。");
  }

  function initSPA() {
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('mainApp').style.display = 'block';
    resetInactivityTimer(); updateHeaderName();
    
    const isUserAdmin = staticData.userInfo.isAdmin === true || staticData.userInfo.isAdmin === 'true';
    if (isUserAdmin) {
      document.getElementById('nav-admin').style.display = 'inline-block';
      document.getElementById('adminPanel').style.display = 'block';
      if (!originalAdminName) { originalAdminName = staticData.userInfo.name; originalAdminEmail = staticData.userInfo.email; }
      clearInterval(adminAutoRefreshTimer);
      adminAutoRefreshTimer = setInterval(() => {
        if (document.getElementById('view-admin').classList.contains('active') && document.getElementById('admin-page1').style.display !== 'none') {
          loadAdminDaily(true); 
        }
      }, 5 * 60 * 1000);
    } else {
      document.getElementById('nav-admin').style.display = 'none';
      document.getElementById('adminPanel').style.display = 'none';
    }

    toggleLoadingState(true); renderSkeleton();
    
    AppAPI.call('getAppStartupData', { email: staticData.userInfo.email, targetDate: document.getElementById('targetDate').value }).then(data => {
      if (data && data.staticData) {
        ['items','classes','periods','users'].forEach(k => { if(data.staticData[k]) staticData[k] = data.staticData[k]; });
      }
      initDropdowns();
      if(data && data.bookingStatus) {
        renderDailyBoard(data.bookingStatus); renderTable(data.bookingStatus);
        document.getElementById('syncTag').innerText = ""; toggleLoadingState(false);
      } else { refreshBooking(); }
    }).catch(err => {
       showSystemAlert("系統連線發生錯誤，無法載入初始資料。"); toggleLoadingState(false);
    });
  }

  function updateHeaderName() {
    document.getElementById('displayUserName').innerText = staticData.userInfo.name;
    document.getElementById('userName').value = staticData.userInfo.name;
  }

  function switchAppView(viewId) {
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    document.getElementById('nav-' + viewId).classList.add('active');
    document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
    document.getElementById('view-' + viewId).classList.add('active');

    if (viewId === 'booking') refreshBooking();
    else if (viewId === 'myrecords') loadMyRecordsData();
    else if (viewId === 'admin') { switchAdminTab(1); loadAdminDaily(); }
  }

  function initDropdowns() {
    const itemSel = document.getElementById('itemSelect'); const resItem = document.getElementById('resItem');
    const itemsHtml = staticData.items.map(i => `<option value="${i}">${i}</option>`).join('');
    if(staticData.items.length > 0) { itemSel.innerHTML = itemsHtml; resItem.innerHTML = itemsHtml; }
    
    const classSel = document.getElementById('classSelect');
    if(staticData.classes.length > 0) classSel.innerHTML = staticData.classes.map(c => `<option value="${c}">${c}</option>`).join('');
    
    const adminSwitchSel = document.getElementById('adminSwitchName');
    if(staticData.users.length > 0) adminSwitchSel.innerHTML = staticData.users.map(u => `<option value="${u.email}">${u.name}</option>`).join('');
    adminSwitchSel.value = spoofedUserName === "" ? originalAdminEmail : staticData.userInfo.email;

    document.getElementById('periodChecks').innerHTML = staticData.periods.map(p => `<label class="check-item"><input type="checkbox" name="pCheck" value="${p.name}"> ${p.name}</label>`).join('');
  }

  function switchUserProxy() {
    const sel = document.getElementById('adminSwitchName');
    const newEmail = sel.value; const newName = sel.options[sel.selectedIndex].text;
    if (!newEmail || newEmail === originalAdminEmail) { resetUserProxy(); return; }
    spoofedUserName = newName; staticData.userInfo.name = newName; staticData.userInfo.email = newEmail; 
    document.getElementById('proxyCurrentName').innerText = newName; document.getElementById('proxyAlert').style.display = 'flex';
    updateHeaderName(); showSystemAlert(`✅ 已切換為代理模式！\n操作將屬於「${newName}」。`);
    if(document.getElementById('view-booking').classList.contains('active')) refreshBooking();
  }

  function resetUserProxy() {
    if (!originalAdminName) return;
    spoofedUserName = ""; staticData.userInfo.name = originalAdminName; staticData.userInfo.email = originalAdminEmail;
    document.getElementById('adminSwitchName').value = originalAdminEmail;
    document.getElementById('proxyAlert').style.display = 'none'; updateHeaderName(); showSystemAlert(`🔄 已還原為管理員本人。`);
    if(document.getElementById('view-booking').classList.contains('active')) refreshBooking();
  }

  function toggleLoadingState(isLoading) {
    const dateInput = document.getElementById('targetDate'); const itemInput = document.getElementById('itemSelect');
    if (isLoading) { dateInput.disabled = true; dateInput.classList.add('locked-input'); itemInput.disabled = true; itemInput.classList.add('locked-input'); } 
    else { dateInput.disabled = false; dateInput.classList.remove('locked-input'); itemInput.disabled = false; itemInput.classList.remove('locked-input'); }
  }

  function renderSkeleton() {
    let h = `<table><tr><th style="width:100px;">節次</th>${'<th>讀取中</th>'.repeat(5)}</tr>`;
    const pList = staticData.periods.length > 0 ? staticData.periods : [{name:'載入中'}];
    pList.forEach(p => { h += `<tr><td style="font-weight:bold;">${p.name}</td>${'<td><div class="skeleton"></div></td>'.repeat(5)}</tr>`; });
    document.getElementById('tableBox').innerHTML = h + "</table>";
  }

  function refreshBooking() {
    const targetDate = document.getElementById('targetDate').value; const targetItem = document.getElementById('itemSelect').value;
    if(!targetDate || !targetItem || targetItem.includes('無可用')) return;
    const requestSerial = ++bookingRequestSerial;
    document.getElementById('syncTag').innerText = "(同步中...)";
    toggleLoadingState(true); renderSkeleton(); document.getElementById('dailyBoard').style.display = 'none';
    
    AppAPI.call('getBookingStatus', { targetDate, selectedItem: targetItem }).then(status => {
        const isLatestRequest = requestSerial === bookingRequestSerial;
        const isSameSelection = document.getElementById('targetDate').value === targetDate && document.getElementById('itemSelect').value === targetItem;
        if (!isLatestRequest || !isSameSelection) return;
        renderDailyBoard(status); renderTable(status);
        document.getElementById('syncTag').innerText = ""; toggleLoadingState(false);
      }).catch(err => {
        if (requestSerial !== bookingRequestSerial) return;
        document.getElementById('syncTag').innerText = "(同步失敗)"; toggleLoadingState(false);
      });
  }

  function renderDailyBoard(status) {
    const board = document.getElementById('dailyBoard');
    const tDate = document.getElementById('targetDate').value;
    const dayLabel = (tDate === getLocalTodayString()) ? "今日" : "指定日期";
    if (status.dailyAll && status.dailyAll.length > 0) {
      let boardHtml = `<h3>📌 ${dayLabel} (${tDate}) 總借用狀態</h3><div style="display: flex; flex-direction: column; gap: 10px; margin-top: 12px;">`;
      staticData.periods.forEach(p => {
        const recordsInPeriod = status.dailyAll.filter(r => r.period === p.name);
        if (recordsInPeriod.length > 0) {
          const tags = recordsInPeriod.map(r => `<div class="daily-tag">${r.item} (${r.user})</div>`).join('');
          boardHtml += `<div style="display: flex; align-items: flex-start; gap: 10px; border-bottom: 2px dashed #fdebd0; padding-bottom: 10px;">
                          <div style="font-weight: bold; color: #d35400; width: 60px; flex-shrink: 0; margin-top: 5px;">${p.name}</div>
                          <div class="daily-tags" style="margin: 0;">${tags}</div>
                        </div>`;
        }
      });
      board.innerHTML = boardHtml + `</div>`;
    } else {
      board.innerHTML = `<h3>📌 ${dayLabel} (${tDate}) 總借用狀態</h3><div style="color:#888; font-size:11pt; font-weight:600;">該日尚無任何預約紀錄</div>`;
    }
    board.style.display = 'block';
  }

  function renderTable(status) {
    if (!status.weekDates || status.weekDates.length === 0) return;
    let h = `<table><tr><th style="width:90px;">節次</th>`;
    status.weekDates.forEach(d => {
      const dayIdx = new Date(d.replace(/-/g, '/')).getDay();
      h += `<th style="${(dayIdx===0||dayIdx===6)?'color: var(--danger);':''}">${d.slice(5)}<br><span style="font-size:10pt; font-weight:normal;">(${dayNames[dayIdx]})</span></th>`;
    });
    h += `</tr>`;
    
    const nowTs = Date.now(); 
    staticData.periods.forEach(p => {
      h += `<tr><td style="font-weight:bold; background:#f8fafc; color:var(--primary);">${p.name}</td>`;
      status.weekDates.forEach(d => {
        let periodEndTs = p.end ? new Date(d.replace(/-/g, '/') + ' ' + p.end).getTime() : nowTs + 9999999;
        const isB = status.records.find(r => r.date === d && r.period === p.name);
        const isR = status.restrictions.find(r => r.date === d && r.period === p.name);
        if (isR) h += `<td class="cell-restricted">🔒 ${isR.note || '禁借'}</td>`;
        else if (isB) {
          const currentEmail = String(staticData.userInfo.email || '').trim().toLowerCase();
          const bookedEmail = String(isB.email || '').trim().toLowerCase();
          const isMe = bookedEmail ? bookedEmail === currentEmail : isB.user === staticData.userInfo.name;
          h += `<td><span class="${isMe?'cell-mine':'cell-booked'}">${isMe?'本人預約':isB.user}</span></td>`;
        } 
        else if (periodEndTs < nowTs) h += `<td><span class="cell-past">已過期</span></td>`;
        else h += `<td><button class="btn-book" onclick="openModal('${d}','${p.name}')">預約</button></td>`;
      });
      h += `</tr>`;
    });
    document.getElementById('tableBox').innerHTML = h + "</table>";
  }

  function openModal(d, p) {
    currentSel = { d, p, item: document.getElementById('itemSelect').value };
    document.getElementById('confirmDetail').innerHTML = `📅 借用日期：<b>${d}</b><br>⏱️ 節次：<b>${p}</b><br>🔬 設備：<b>${currentSel.item}</b>`;
    document.getElementById('overlay').style.display = 'block'; document.getElementById('modal').style.display = 'block';
  }
  function closeModal() { document.getElementById('overlay').style.display = 'none'; document.getElementById('modal').style.display = 'none'; }
  function togglePurpose() {
    const isOther = document.getElementById('purposeType').value === 'other';
    document.getElementById('classDiv').style.display = isOther ? 'none' : 'block';
    document.getElementById('otherDiv').style.display = isOther ? 'block' : 'none';
  }

  function submitBooking() {
    const pVal = document.getElementById('purposeType').value === 'class' ? document.getElementById('classSelect').value : document.getElementById('otherPurpose').value;
    const btn = document.querySelector('#modal button');
    btn.innerText = "⏳ 處理中..."; btn.disabled = true;

    AppAPI.call('submitBooking', { date: currentSel.d, period: currentSel.p, item: currentSel.item, user: staticData.userInfo.name, email: staticData.userInfo.email, purpose: pVal })
      .then((res) => {
        btn.innerText = "送出預約"; btn.disabled = false; closeModal();
        if (res && res.success) { showSystemAlert("✅ 預約成功！"); refreshBooking(); } 
        else { showSystemAlert(res ? res.msg : "發生錯誤"); refreshBooking(); }
      }).catch(err => {
        btn.innerText = "送出預約"; btn.disabled = false; closeModal();
        showSystemAlert("連線錯誤，預約失敗");
      });
  }

  function loadMyRecordsData() {
    const upBox = document.getElementById('list-upcoming');
    upBox.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
    document.getElementById('list-past').innerHTML = '';
    AppAPI.call('getMyRecords', { email: staticData.userInfo.email }).then(records => { allMyRecords = records; renderRecordLists(); }).catch(err => console.error("載入紀錄失敗", err));
  }

  function getPeriodEndTime(periodName) {
    const pInfo = staticData.periods.find(p => p.name === periodName);
    return (pInfo && pInfo.end) ? pInfo.end : "23:59"; 
  }

  function renderRecordLists() {
    const nowTs = Date.now();
    let upcoming = [], pastEnded = [], pastCancelled = [];
    allMyRecords.forEach(r => {
      if (r.purpose === '已取消') { pastCancelled.push(r); return; }
      let isPast = false;
      const pInfo = staticData.periods.find(p => p.name === r.period);
      if (pInfo && pInfo.end) { if (nowTs > new Date(r.date.replace(/-/g, '/') + ' ' + pInfo.end).getTime()) isPast = true; } 
      else { if (r.date < getLocalTodayString()) isPast = true; }
      if (isPast) pastEnded.push(r); else upcoming.push(r);
    });
    const sortLogicDesc = (a, b) => { if (a.date !== b.date) return b.date.localeCompare(a.date); return getPeriodEndTime(a.period).localeCompare(getPeriodEndTime(b.period)); };
    const sortLogicAsc = (a, b) => { if (a.date !== b.date) return a.date.localeCompare(b.date); return getPeriodEndTime(a.period).localeCompare(getPeriodEndTime(b.period)); };

    upcoming.sort(sortLogicAsc); pastEnded.sort(sortLogicDesc); pastCancelled.sort(sortLogicDesc);

    const upBox = document.getElementById('list-upcoming');
    upBox.innerHTML = upcoming.length ? upcoming.map(r => createRecordCard(r, true)).join('') : '<div style="text-align:center; padding:40px; color:#94a3b8; background:#f8fafc; border-radius:12px; font-weight:bold; border: 2px dashed #cbd5e1;">目前沒有即將到來的預約 🎉</div>';
    const pastBox = document.getElementById('list-past');
    if (pastEnded.length === 0 && pastCancelled.length === 0) { pastBox.innerHTML = '<div style="text-align:center; padding:40px; color:#94a3b8; background:#f8fafc; border-radius:12px; font-weight:bold; border: 2px dashed #cbd5e1;">目前沒有歷史紀錄</div>'; } 
    else { pastBox.innerHTML = (pastEnded.length > 0 ? `<div style="font-size: 13pt; font-weight: bold; margin: 25px 0 10px 0; color:var(--gray);">☑️ 已結束</div>` + pastEnded.map(r => createRecordCard(r, false)).join('') : '') + (pastCancelled.length > 0 ? `<div style="font-size: 13pt; font-weight: bold; margin: 25px 0 10px 0; color:var(--danger);">🚫 已取消</div>` + pastCancelled.map(r => createRecordCard(r, false)).join('') : ''); }
  }

  function createRecordCard(r, isUpcoming) {
    const isCancelled = r.purpose === '已取消';
    let cardClass = isCancelled ? 'card cancelled' : (isUpcoming ? 'card' : 'card past');
    let actionHtml = isCancelled ? `<div class="status-badge status-cancelled">已取消</div>` : (isUpcoming ? `<button class="btn-cancel" onclick="cancelUserRecord(${r.rowId}, this)">取消預約</button>` : `<div class="status-past">已結束</div>`);

    return `<div class="${cardClass}">
              <div class="info">
                <div class="title">📅 ${r.date} &nbsp;|&nbsp; ⏱️ ${r.period}</div>
                <div class="detail">設備/教室：<span>${r.item}</span><br>預約用途：${r.purpose !== '已取消' ? r.purpose : '<span style="color:#aaa; font-weight:normal; background:transparent;">--</span>'}</div>
              </div>
              <div>${actionHtml}</div>
            </div>`;
  }

  function switchSubTab(tab) {
    document.getElementById('list-upcoming').style.display = tab === 'upcoming' ? 'block' : 'none';
    document.getElementById('list-past').style.display = tab === 'past' ? 'block' : 'none';
    document.getElementById('tab-upcoming').className = tab === 'upcoming' ? 'tab active' : 'tab';
    document.getElementById('tab-past').className = tab === 'past' ? 'tab active' : 'tab';
  }

  function cancelUserRecord(rowId, btnElement) {
    showSystemConfirm("⚠️ 確定要取消這筆預約嗎？取消後將釋出該時段給其他人借用。", () => {
      btnElement.innerText = "⏳ 取消中..."; btnElement.disabled = true;
      AppAPI.call('cancelBooking', { rowId: rowId }).then(() => {
        showSystemAlert("✅ 預約已成功取消！"); loadMyRecordsData(); 
      }).catch(err => showSystemAlert("取消失敗"));
    });
  }

  function switchAdminTab(n) {
    [1,2,3].forEach(i => {
      document.getElementById('admin-page'+i).style.display = n === i ? 'block' : 'none';
      document.getElementById('admin-t'+i).className = n === i ? 'admin-tab active' : 'admin-tab';
    });
    if (n === 3) loadChart();
  }

  function loadAdminDaily(isSilent = false) {
    const box = document.getElementById('adminDailyList');
    if (!isSilent) box.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
    AppAPI.call('getAdminDailyRecords', { date: document.getElementById('adminDate').value }).then(records => { if(records) renderAdminDailyRecords(records); }).catch(err => console.error("載入管理員紀錄失敗", err));
  }

  function renderAdminDailyRecords(records) {
    const box = document.getElementById('adminDailyList');
    if(records.length === 0) { box.innerHTML = "<div style='text-align:center; padding:40px; color:#94a3b8; background:#f8fafc; border-radius:12px; font-weight:bold; border: 2px dashed #cbd5e1;'>本日無預約紀錄</div>"; return; }
    let html = '';
    staticData.periods.forEach(p => {
      const pRecords = records.filter(r => r.period === p.name);
      if (pRecords.length > 0) {
        html += `<h3 style="color:var(--admin-purple); margin: 25px 0 15px 0; font-size: 14pt; font-family:'Fredoka', sans-serif;">📍 ${p.name}</h3>`;
        html += pRecords.map(r => `
          <div class="admin-card">
            <div style="font-weight:bold; font-size:13pt; color:var(--primary);">${r.item}</div>
            <div style="color:#64748b; margin-top:8px; font-size:11pt; font-weight:600;">借用人：<span style="color:var(--admin-purple); font-weight:700; background:#f1f5f9; padding:2px 6px; border-radius:6px;">${r.user}</span> (${r.purpose})</div>
            <div class="key-group" style="align-items: center;">
              <span style="font-weight:bold; color:#94a3b8; font-size:11pt; white-space:nowrap;">🔑 鑰匙：</span>
              <button class="key-btn ${r.keyStatus==='未借出'?'active-unlent':''}" onclick="setKey(${r.rowId}, '未借出', this)">未借出</button>
              <button class="key-btn ${r.keyStatus==='已借出'?'active-lent':''}" onclick="setKey(${r.rowId}, '已借出', this)">已借出</button>
              <button class="key-btn ${r.keyStatus==='已歸還'?'active-returned':''}" onclick="setKey(${r.rowId}, '已歸還', this)">已歸還</button>
            </div>
          </div>
        `).join('');
      }
    });
    box.innerHTML = html;
  }

  function setKey(id, status, btn) {
    const row = btn.parentElement; row.querySelectorAll('.key-btn').forEach(b => b.className = 'key-btn');
    if(status==='未借出') btn.classList.add('active-unlent');
    if(status==='已借出') btn.classList.add('active-lent');
    if(status==='已歸還') btn.classList.add('active-returned');
    AppAPI.call('updateKeyStatus', { id: id, status: status });
  }

  function submitRestrict() {
    const item = document.getElementById('resItem').value; const sDate = document.getElementById('resStartDate').value; const eDate = document.getElementById('resEndDate').value; const note = document.getElementById('resNote').value;
    const days = Array.from(document.querySelectorAll('input[name="dCheck"]:checked')).map(cb => cb.value);
    const periods = Array.from(document.querySelectorAll('input[name="pCheck"]:checked')).map(cb => cb.value);
    
    if(!sDate || !eDate) { showSystemAlert("請選擇完整的日期範圍！"); return; }
    if(sDate > eDate) { showSystemAlert("⚠️ 結束日期不能早於開始日期！"); return; }
    if(days.length === 0) { showSystemAlert("請至少勾選一天適用星期！"); return; }
    if(periods.length === 0) { showSystemAlert("請至少勾選一個禁借節次！"); return; }
    if(!note) { showSystemAlert("請填寫備註原因！"); return; }
    
    const btn = document.getElementById('resSubmitBtn'); btn.innerText = "⏳ 寫入資料中，請稍候..."; btn.disabled = true;
    AppAPI.call('batchRestrictAdvanced', { item: item, sDateStr: sDate, eDateStr: eDate, daysOfWeek: days, periods: periods, note: note }).then((res) => {
      if(res.success) { showSystemAlert("✅ " + res.msg); document.querySelectorAll('input[name="pCheck"]').forEach(cb => cb.checked = false); document.getElementById('resNote').value = ""; } 
      else { showSystemAlert("⚠️ " + res.msg); }
      btn.innerText = "確認並寫入設定"; btn.disabled = false;
    }).catch(err => { showSystemAlert("系統錯誤"); btn.innerText = "確認並寫入設定"; btn.disabled = false; });
  }

  let confirmCallback = null;
  function showSystemConfirm(msg, callback) {
    document.getElementById('alertMessage').innerText = msg;
    document.getElementById('alertBtns').innerHTML = `<div class="confirm-btns"><button class="btn-cancel-modal" onclick="closeSystemAlert()">取消</button><button class="btn-confirm-modal" onclick="executeConfirm()">確定</button></div>`;
    confirmCallback = callback; document.getElementById('alertOverlay').style.display = 'block'; document.getElementById('alertModal').style.display = 'block';
  }
  function executeConfirm() { closeSystemAlert(); if(confirmCallback) confirmCallback(); }
  function showSystemAlert(msg) {
    document.getElementById('alertMessage').innerText = msg;
    document.getElementById('alertBtns').innerHTML = `<button class="btn-alert" onclick="closeSystemAlert()">確定</button>`;
    document.getElementById('alertOverlay').style.display = 'block'; document.getElementById('alertModal').style.display = 'block';
  }
  function closeSystemAlert() { document.getElementById('alertOverlay').style.display = 'none'; document.getElementById('alertModal').style.display = 'none'; }

  let currentChartData = { item: { labels: [], values: [] }, user: { labels: [], values: [] } };
  let currentChartMode = 'item'; 

  function loadChart() {
    document.getElementById('leaderboardList').innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
    AppAPI.call('getStatisticsData').then(function(data) {
      let sortedItems = data.items.sort((a, b) => b.count - a.count).slice(0, 10);
      let sortedUsers = data.users.sort((a, b) => b.count - a.count).slice(0, 10);
      currentChartData.item.labels = sortedItems.map(d => d.name); currentChartData.item.values = sortedItems.map(d => d.count);
      currentChartData.user.labels = sortedUsers.map(d => d.name); currentChartData.user.values = sortedUsers.map(d => d.count);
      renderDashboard();
    }).catch(err => console.error("獲取統計資料失敗", err));
  }

  function switchChartTab(mode) {
    currentChartMode = mode;
    document.getElementById('ctab-item').classList.toggle('active', mode === 'item'); document.getElementById('ctab-user').classList.toggle('active', mode === 'user');
    renderDashboard(); 
  }

  function renderDashboard() {
    const dataObj = currentChartData[currentChartMode];
    const labels = dataObj.labels;
    const values = dataObj.values;
    const labelTitle = currentChartMode === 'item' ? '設備借用次數' : '使用者借用次數';
    const color = currentChartMode === 'item' ? 'rgba(27, 130, 150, 0.7)' : 'rgba(96, 165, 250, 0.8)'; 
    const borderColor = currentChartMode === 'item' ? 'rgba(27, 130, 150, 1)' : 'rgba(96, 165, 250, 1)';

    const ctx = document.getElementById('myChart').getContext('2d');
    if (myChartInstance) myChartInstance.destroy();
    
    myChartInstance = new Chart(ctx, {
      type: 'bar',
      data: { labels: labels, datasets: [{ label: labelTitle, data: values, backgroundColor: color, borderColor: borderColor, borderWidth: 2, borderRadius: 6 }] },
      options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }, plugins: { legend: { display: false } } }
    });

    const board = document.getElementById('leaderboardList');
    if (labels.length === 0) { board.innerHTML = '<div style="text-align:center; padding:30px; color:#999; font-weight:bold;">尚無借用紀錄</div>'; return; }
    let html = ''; const medals = ['🥇', '🥈', '🥉'];
    for(let i = 0; i < labels.length; i++) {
      let rankIcon = i < 3 ? medals[i] : (i + 1);
      html += `<li class="leaderboard-item rank-${i+1}"><div class="rank-badge">${rankIcon}</div><div class="item-name">${labels[i]}</div><div class="item-count">${values[i]} <span style="font-size:9pt; color:#888;">次</span></div></li>`;
    }
    board.innerHTML = html;
  }

  function downloadChart() {
    if (!myChartInstance) return showSystemAlert("資料尚未載入！");
    const canvas = document.getElementById('myChart'); const destCanvas = document.createElement('canvas');
    destCanvas.width = canvas.width; destCanvas.height = canvas.height;
    const destCtx = destCanvas.getContext('2d');
    destCtx.fillStyle = '#f8fafc'; destCtx.fillRect(0, 0, destCanvas.width, destCanvas.height); destCtx.drawImage(canvas, 0, 0);
    const link = document.createElement('a'); link.href = destCanvas.toDataURL('image/png');
    const title = currentChartMode === 'item' ? '設備排行榜' : '達人排行榜';
    link.download = `Lab_Equipment_${title}_${new Date().toISOString().split('T')[0]}.png`; link.click();
  }

  function downloadCSV() {
    const dataObj = currentChartData[currentChartMode];
    if (dataObj.labels.length === 0) return showSystemAlert("目前沒有資料可以匯出喔！");
    const titleName = currentChartMode === 'item' ? '設備/教室名稱' : '使用者姓名';
    let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; csvContent += `排名,${titleName},總借用次數\n`; 
    for(let i = 0; i < dataObj.labels.length; i++) { csvContent += `${i+1},"${dataObj.labels[i]}",${dataObj.values[i]}\n`; }
    const encodedUri = encodeURI(csvContent); const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    const fileTitle = currentChartMode === 'item' ? '設備統計' : '使用者統計';
    link.setAttribute("download", `Lab_Equipment_${fileTitle}_${new Date().toISOString().split('T')[0]}.csv`);
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
  }

</script>
